<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Translucent Calendar Popup</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
    }

    .calendar-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      padding: 2rem;
      width: 300px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 1000;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    h2 {
      margin: 0 0 1rem 0;
      color: #333;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day-label {
      text-align: center;
      font-weight: bold;
      color: #666;
    }

    .day {
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      background: #e0e0e0;
      transition: background 0.2s ease;
    }

    .day:hover {
      background: #d0d0d0;
    }

    .current-day {
      background: #007bff;
      color: white;
      font-weight: bold;
    }

    .button-container {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
    }

    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s ease;
    }

    .btn-close {
      background: #dc3545;
      color: white;
    }

    .btn-prev {
      background: #007bff;
      color: white;
    }

    .btn-next {
      background: #28a745;
      color: white;
    }

    .btn-prev:hover, .btn-next:hover {
      background: #1a6f3a;
    }

    .btn-close:hover {
      background: #c82333;
    }

    .calendar-grid > div {
      display: flex;
      align-items: center;
      justify-content: center;

  </style>
