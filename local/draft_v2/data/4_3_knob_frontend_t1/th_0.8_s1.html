<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Translucent Calendar Popup</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .calendar-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      padding: 20px;
      width: 300px;
      animation: fadeIn 0.4s ease-in-out;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
    }

    .calendar-popup h2 {
      margin-top: 0;
      text-align: center;
      color: #333;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-top: 20px;
    }

    .calendar-day {
      text-align: center;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      color: #555;
      background-color: #f9f9f9;
      cursor: default;
    }

    .calendar-day.today {
      background-color: #007bff;
      color: white;
      font-weight: bold;
    }

    .calendar-day.selected {
      background-color: #00c6ff;
      color: white;
      font-weight: bold;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    .close-btn {
      display: block;
      margin: 20px auto 0;
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s ease;
    }

    .close-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="calendar-popup">
    <h2>Calendar</h2>
    <div class="calendar-grid">
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>

  </div>
</body>
</html>
