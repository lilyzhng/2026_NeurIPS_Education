```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Translucent Calendar Popup</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .calendar-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 1000;
      width: 90%;
      max-width: 400px;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .calendar-header h2 {
      margin: 0;
      font-size: 1.5rem;
      color: #333;
    }

    .calendar-header button {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #888;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      margin-top: 1rem;
    }

    .calendar-day {
      text-align: center;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #555;
      background: #f9f9f9;
      transition: background 0.3s ease;
    }

    .calendar-day:hover {
      background: #e0e0e0;
    }

    .calendar-day.today {
      background: #d0f0c0;
      font-weight: bold;
    }

    .calendar-day.selected {
      background: #007bff;
      color: white;
      font-weight: bold;
    }

    .calendar-actions {
      margin-top: 1.5rem;
      text-align: center;
    }

    .calendar-actions button {
      padding: 0.5rem 1rem;
      margin: 0 0.5rem;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .calendar-actions button:hover {
      background: #0056b3;
    }

    .calendar-actions button.cancel {
      background: #dc3545;
    }

    .calendar-actions button.cancel:hover {
      background: #c82333;
    }
  </style>
</head>
<body>
  <div class="calendar-popup">
    <div class="calendar-header">
      <h2>Calendar</h2>
      <button onclick="document.querySelector('.calendar-popup').style.display='none'">&times;</button>
    </div>
    <div class="calendar-grid">
      <div>Su</div>
      <div>Mo</div>
      <div>Tu</div>
      <div>We</div>
      <div>Th</div>
      <div>Fr</div>
      <div>Sa</div>
      <!-- Example days -->
      <div class="calendar-day">25</div>
      <div class="calendar-day">26</div>
      <div class="calendar-day">27</div>
      <div class="calendar-day">28</div>
      <div class="calendar-day">29</div>
      <div class="calendar-day">30</div>
      <div class="calendar-day">31</div>
      <div class="calendar-day">1</div>
      <div class="calendar-day">2</div>
      <div class="calendar-day today">3</div>
      <div class="calendar-day">4</div>
      <div class="calendar-day">5</div>
      <div class="calendar-day">6</div>
      <div class="calendar-day">7</div>
      <div class="calendar-day">8</div>
      <div class="calendar-day selected">9</div>
      <div class="calendar-day">10</div>
      <div class="calendar-day">11</div>
      <div class="calendar-day">12</div>
      <div class="calendar-day">13</div>
      <div class="calendar-day">14</div>
      <div class="calendar-day">15</div>
      <div class="calendar-day">16</div>
      <div class="calendar-day">17</div>
      <div class="calendar-day">18</div>
      <div class="calendar-day">19</div>
      <div class="calendar-day">20</div>
      <div class="calendar-day">21</div>
      <div class="calendar-day">22</div>
      <div class="calendar-day">23</div>
      <div class="calendar-day">24</div>
      <div class="calendar-day">25</div>
      <div class="calendar-day">26</div>
      <div class="calendar-day">27</div>
    </div>
    <div class="calendar-actions">
      <button class="cancel" onclick="document.querySelector('.calendar-popup').style.display='none'">Cancel</button>
      <button onclick="alert('Date selected')">Select</button>
    </div>
  </div>
</body>
</html>
