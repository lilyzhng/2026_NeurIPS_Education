<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Translucent Calendar Popup</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      background: #f0f0f0;
      position: relative;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .calendar-popup {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      padding: 2rem;
      width: 300px;
      text-align: center;
      position: relative;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .calendar-popup h2 {
      margin: 0 0 1rem;
      color: #333;
    }

    .calendar-popup table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
    }

    .calendar-popup th,
    .calendar-popup td {
      padding: 0.5rem;
      border: 1px solid #ccc;
      text-align: center;
    }

    .calendar-popup th {
      background: #f0f0f0;
      font-weight: bold;
    }

    .calendar-popup td {
      background: #fff;
    }

    .calendar-popup td.today {
      background: #e0f7fa;
      font-weight: bold;
    }

    .calendar-popup .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #888;
    }

    .calendar-popup .close-btn:hover {
      color: #333;
    }

    .calendar-popup .footer {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="overlay" id="calendarOverlay">
    <div class="calendar-popup">
      <button class="close-btn" onclick="closeCalendar()">×</button>
      <h2>Calendar</h2>
      <table>
        <thead>
          <tr>
            <th>Sun</th>

            <th>Sat</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
          </tr>
          <tr>
            <td>5</td>
            <td>6</td>
            <td>7</td>
            <td>8</td>
            <td>9</td>
            <td>10</td>
            <td class="today">11</td>
          </tr>
          <tr>
            <td>12</td>
            <td>13</td>
            <td>14</td>
            <td>15</td>
            <td>16</td>

            <td>18</td>

          <tr>

  </div>

  <script>
    function openCalendar() {
      document.getElementById('calendarOverlay').classList.add('show');
    }

    function closeCalendar() {
      document.getElementById('calendarOverlay').classList.remove('show');
    }

    // Simulate opening the calendar on a button click
