<script>
  // Scroll-spy: highlight the active section in the sidebar TOC
  (function () {
    const links = [...document.querySelectorAll('.toc a')];
    const byId = new Map(links.map(a => [a.getAttribute('href').slice(1), a]));
    const targets = [...byId.keys()].map(id => document.getElementById(id)).filter(Boolean);
    let current = null;
    function setActive(id) {
      if (id === current) return;
      current = id;
      links.forEach(a => a.classList.remove('active'));
      const a = byId.get(id);
      if (a) a.classList.add('active');
    }
    const obs = new IntersectionObserver((entries) => {
      const visible = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (visible.length) setActive(visible[0].target.id);
    }, { rootMargin: '-12% 0px -70% 0px', threshold: 0 });
    targets.forEach(t => obs.observe(t));
    if (targets.length) setActive(targets[0].id);
  })();
</script>

<script>
  // Glossary terms: hover/focus on desktop; tap to toggle on touch devices.
  (function () {
    const terms = [...document.querySelectorAll('.glossary-term')];
    const mobileQuery = window.matchMedia('(max-width: 640px)');
    function placeTooltip(term) {
      if (!mobileQuery.matches) return;
      const tooltip = term.querySelector('.glossary-tooltip');
      const rect = term.getBoundingClientRect();
      const margin = 16;
      const gap = 12;
      const width = Math.min(288, window.innerWidth - margin * 2);
      const left = Math.max(margin, Math.min(
        rect.left + rect.width / 2 - width / 2,
        window.innerWidth - margin - width
      ));
      const height = tooltip.offsetHeight;
      const fitsAbove = rect.top - height - gap >= margin;
      const top = fitsAbove ? rect.top - height - gap : rect.bottom + gap;
      const arrowLeft = Math.max(16, Math.min(rect.left + rect.width / 2 - left, width - 16));
      term.style.setProperty('--tooltip-left', `${left}px`);
      term.style.setProperty('--tooltip-top', `${top}px`);
      term.style.setProperty('--tooltip-arrow-left', `${arrowLeft}px`);
      term.classList.toggle('tooltip-below', !fitsAbove);
    }
    function closeAll(except) {
      terms.forEach(term => {
        if (term === except) return;
        term.classList.remove('is-open');
        term.classList.remove('tooltip-below');
        term.setAttribute('aria-expanded', 'false');
      });
    }
    terms.forEach(term => {
      term.addEventListener('click', function (event) {
        event.stopPropagation();
        const open = !term.classList.contains('is-open');
        closeAll(term);
        placeTooltip(term);
        term.classList.toggle('is-open', open);
        term.setAttribute('aria-expanded', String(open));
        if (!open) term.blur();
      });
      term.addEventListener('keydown', function (event) {
        if (event.key !== 'Escape') return;
        term.classList.remove('is-open');
        term.setAttribute('aria-expanded', 'false');
        term.blur();
      });
    });
    window.addEventListener('resize', function () {
      const open = terms.find(term => term.classList.contains('is-open'));
      if (open) placeTooltip(open);
    });
    window.addEventListener('scroll', function () {
      const open = terms.find(term => term.classList.contains('is-open'));
      if (open) placeTooltip(open);
    }, { passive: true });
    document.addEventListener('click', function () {
      closeAll();
      if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
    });
  })();
</script>

<script>
  // Auto-size iframes whose embedded page posts {chalkHeight, chalkSrc}
  window.addEventListener('message', function (e) {
    if (!e.data || !e.data.chalkHeight) return;
    document.querySelectorAll('iframe').forEach(function (f) {
      if (f.src.indexOf(e.data.chalkSrc) !== -1) f.style.height = e.data.chalkHeight + 'px';
    });
  });
</script>

</body>
</html>
