<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Explore the frontend tasks</title>
<style>
  body { margin:0; padding:14px 18px 18px; font-family:'ET Book', Palatino, Georgia, serif;
         background:#fffffb; color:#111; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chip { font-size:13px; padding:4px 12px; border-radius:999px; border:1px solid #d8d8d0;
           background:#fff; cursor:pointer; font-family:inherit; }
  .chip:hover { border-color:#1f5c3d; }
  .chip.on { background:#1f5c3d; color:#fff; border-color:#1f5c3d; }
  .brief { font-size:15px; font-style:italic; color:#444; margin:2px 0 12px; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .cell { border:1px solid #e2e2da; border-radius:12px; overflow:hidden; background:#fff;
           box-shadow:0 1px 4px rgba(0,0,0,.04); }
  .head { display:flex; gap:10px; align-items:baseline; padding:9px 14px 7px; }
  .head b { font-size:15px; }
  .head .v { color:#1f5c3d; } .head .p { color:#d6437c; }
  .total { font-size:13px; color:#666; }
  .wbadge { margin-left:auto; font-size:11px; letter-spacing:.5px; font-weight:700;
             color:#8a6d1a; background:#f7edd2; border:1px solid #e3cf94;
             padding:2px 10px; border-radius:999px; align-self:center;
             font-family:-apple-system,sans-serif; }
  .meters { display:flex; gap:14px; padding:0 14px 8px; }
  .m { flex:1; }
  .m .lab { font-size:11px; color:#888; letter-spacing:.3px; margin-bottom:2px;
             font-family:-apple-system,sans-serif; }
  .m .bar { height:6px; border-radius:3px; background:#eeeee6; overflow:hidden; }
  .m .fill { height:100%; border-radius:3px; }
  .cell.van .fill { background:#1f5c3d; } .cell.dfl .fill { background:#d6437c; }
  iframe { width:100%; height:500px; border:0; border-top:1px solid #eee; display:block; background:#fff; }
  .fb { padding:10px 14px 12px; font-size:13.5px; line-height:1.5; color:#3a3a36;
         border-top:1px solid #f0f0e8; min-height:66px; }
</style></head><body>
<div class="chips" id="chips"></div>
<div class="brief" id="brief"></div>
<div class="pair">
  <div class="cell van"><div class="head"><b class="v">vanilla Qwen3-8B</b><span class="total" id="s0"></span><span class="wbadge" id="w0" style="display:none">WINNER</span></div>
    <div class="meters"><div class="m"><div class="lab">CODE <span id="c0"></span>/40</div><div class="bar"><div class="fill" id="cb0"></div></div></div>
    <div class="m"><div class="lab">FUNCTIONALITY <span id="u0"></span>/60</div><div class="bar"><div class="fill" id="ub0"></div></div></div></div>
    <iframe id="f0"></iframe><div class="fb" id="d0"></div></div>
  <div class="cell dfl"><div class="head"><b class="p">+ DFlash draft</b><span class="total" id="s1"></span><span class="wbadge" id="w1" style="display:none">WINNER</span></div>
    <div class="meters"><div class="m"><div class="lab">CODE <span id="c1"></span>/40</div><div class="bar"><div class="fill" id="cb1"></div></div></div>
    <div class="m"><div class="lab">FUNCTIONALITY <span id="u1"></span>/60</div><div class="bar"><div class="fill" id="ub1"></div></div></div></div>
    <iframe id="f1"></iframe><div class="fb" id="d1"></div></div>
</div>
<script>
const DATA = {"od673": {"brief": "Stunning translucent calendar popup that smoothly blends into the interface.", "vanilla": {"file": "vanilla_od673.html", "total": 95, "code": 35, "func": 60, "feedback": "Complete single-file page, no external assets, no console errors. Modal opens/closes smoothly, translucent blur styling, day selection works with clear selected state, hover feedback present. Only flaw: hardcoded April 2024 day layout mismatched with the dynamic month header."}, "dflash": {"file": "dflash_od673.html", "total": 68, "code": 32, "func": 36, "feedback": "Opens/closes via button and backdrop with translucent styling and correct current-month dates, but the calendar grid is structurally broken (tds without trs render as one overflowing row) and the brief-required date selection is entirely missing \u2014 no handler, no selected style."}}, "od5": {"brief": "Create a user interface for a life insurance website.", "vanilla": {"file": "vanilla_od5.html", "total": 40, "code": 40, "func": 0, "feedback": "Clean, well-formed single-file page with no external assets and zero console errors, but entirely static: nav/social links are href=\"#\" placeholders, the CTA button has no handler, and the form submit gives no feedback. Visual shell only, nothing interactive."}, "dflash": {"file": "dflash_od5.html", "total": 100, "code": 40, "func": 60, "feedback": "Complete single-file page, no external assets, no console errors. Every interactive component works: nav anchors scroll to the correct sections, Get a Quote jumps to #contact, and the contact form prevents default and shows a 'Thank you for contacting us!' confirmation alert."}}, "od6": {"brief": "Landing page selling dog-related products.", "vanilla": {"file": "vanilla_od6.html", "total": 68, "code": 35, "func": 33, "feedback": "Clean, valid single-file page with data-URI images and zero console errors, but a layering bug kills the hero CTA and commerce/subscribe buttons are fake anchor jumps. Nav anchors and hover lift work."}, "dflash": {"file": "dflash_od6.html", "total": 61, "code": 28, "func": 33, "feedback": "Functional nav (except broken #about anchor), working hero CTA and hover lift, but violates the single-file constraint with external placeholder images, and cart/subscribe buttons are fake anchor jumps."}}, "od8": {"brief": "Revamped Airbnb homepage for group adventures.", "vanilla": {"file": "vanilla_od8.html", "total": 96, "code": 36, "func": 60, "feedback": "Complete, well-formed single-file page with zero external assets and no console errors. All five interactive components work: three nav anchors scroll correctly (scrollY 0->986), hero button scrolls to booking, and booking form submits with 'Booking submitted!' alert. Only flaw: four invisible Font Awesome icons with no stylesheet."}, "dflash": {"file": "dflash_od8.html", "total": 78, "code": 27, "func": 51, "feedback": "Clean markup and no console errors, nav/hero scrolling and both hover lifts all work. But three external picsum.photos images violate the single-file constraint, and the booking form is a div whose submit button has no handler at all \u2014 clicking after filling all fields produces zero feedback."}}, "od9": {"brief": "Mobile application for vehicle loans and financing on iOS devices.", "vanilla": {"file": "vanilla_od9.html", "total": 55, "code": 40, "func": 15, "feedback": "Clean single-file page with no console errors, no external assets, all CSS selectors live. But the primary CTA button has zero click handler and footer links are bare '#' placeholders; only hover feedback works."}, "dflash": {"file": "dflash_od9.html", "total": 64, "code": 40, "func": 24, "feedback": "Clean single-file page, no console errors, no external assets. CTA button correctly fires an 'App download coming soon!' alert and hover changes background; all three footer links are dead '#' placeholders."}}, "od10": {"brief": "Homepage for an animation studio, Studio Ghibli inspired.", "vanilla": {"file": "vanilla_od10.html", "total": 83, "code": 38, "func": 45, "feedback": "Clean single-file page, no external assets, no JS errors. CTA anchor scrolls correctly, hover effects fire. Only the contact form fails: default submit reloads the page with zero user-facing feedback."}, "dflash": {"file": "dflash_od10.html", "total": 67, "code": 37, "func": 30, "feedback": "Complete valid HTML, no external assets, no JS errors, hover effects work. But the main CTA button is completely inert and the contact form submits into a silent reload with no feedback."}}, "od11": {"brief": "A user interface that resembles Spotify, focusing on music navigation and playlists.", "vanilla": {"file": "vanilla_od11.html", "total": 48, "code": 38, "func": 10, "feedback": "Clean constraint-compliant page (data-URI images, zero console errors), but a pure visual shell: nav links are '#' placeholders, search/play/create-playlist all lack handlers. Only sidebar hover works. Playlist creation is the brief's core ask and is entirely dead."}, "dflash": {"file": "dflash_od11.html", "total": 37, "code": 27, "func": 10, "feedback": "Same dead shell as vanilla (nav '#', inert search/play/create) but with working hovers on links and buttons. Additionally violates single-file constraint with three external placeholder images that fail to load, and renders a stray code fence."}}, "od20": {"brief": "A template to display traffic data using interactive charts and graphs.", "vanilla": {"file": "vanilla_od20.html", "total": 20, "code": 20, "func": 0, "feedback": "Truncated mid-statement; the whole script block is discarded by the HTML parser, leaving two empty bordered canvases. The tooltip logic that would have satisfied the brief never executes. Headers render; nothing else works or even draws."}, "dflash": {"file": "dflash_od20.html", "total": 37, "code": 37, "func": 0, "feedback": "Both canvas charts actually render (line 5804 painted px, bars 27000 painted px), zero console errors, self-contained. But the brief explicitly demands interactive charts and the page has literally zero event listeners: no tooltips, no click response. Static image of a dashboard."}}, "od28": {"brief": "Interactive charts showcasing trading trends and accident statistics in New York.", "vanilla": {"file": "vanilla_od28.html", "total": 5, "code": 5, "func": 0, "feedback": "Generation was cut off inside the <title> tag. The browser renders a blank page; there is nothing to interact with and no code to evaluate beyond the truncation itself."}, "dflash": {"file": "dflash_od28.html", "total": 17, "code": 17, "func": 0, "feedback": "The model's reasoning stream was saved as the deliverable: title, two empty chart boxes, then ~10k chars of visible self-talk including a half-written D3 attempt that throws ReferenceError on load (D3 would have violated the no-external-assets rule anyway). No chart renders, no tooltip exists."}}, "od340": {"brief": "Photo card interface, hover triggers a gentle 3D flip effect.", "vanilla": {"file": "vanilla_od340.html", "total": 27, "code": 27, "func": 0, "feedback": "External placeholder images that fail to load even online, a stray code fence rendered on the page, and a structurally broken flip: the back face is never pre-rotated, so hovering makes the card disappear entirely. Only the transform changes; the effect itself is wrong."}, "dflash": {"file": "dflash_od340.html", "total": 87, "code": 27, "func": 60, "feedback": "Correct, gentle 180deg flip: hover changes computed transform through mid-transition matrix to full rotateY(180deg), front photo swaps to a properly pre-rotated back photo, unhover restores. No console errors. Docked for external picsum URLs, a rendered stray fence, and flat (perspective-less) rotation."}}, "od341": {"brief": "Newsletter registration pop-up, soothing hues, smartphone optimized.", "vanilla": {"file": "vanilla_od341.html", "total": 85, "code": 37, "func": 48, "feedback": "Clean single-file page, zero console errors, soothing teal palette, mobile viewport + media query. Popup shows on load, close button works, invalid email blocked. Submit dismisses the popup but shows no confirmation message, costing half the double-weighted subscribe flow. Decorative pseudo-element circle looks like a close button but is inert."}, "dflash": {"file": "dflash_od341.html", "total": 76, "code": 40, "func": 36, "feedback": "Well-formed single-file page, no console errors, no external assets, calm blue palette, responsive. Popup renders on load and close button works (display:none). But the subscribe button is functionally dead for valid emails \u2014 onsubmit returns false with no confirmation or state change \u2014 failing the brief's double-weighted core flow."}}};
const chips = document.getElementById('chips');
Object.keys(DATA).forEach((t, i) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = t; b.onclick = () => show(t);
  chips.appendChild(b);
});
function show(t) {
  const d = DATA[t];
  [...chips.children].forEach(c => c.classList.toggle('on', c.textContent === t));
  document.getElementById('brief').textContent = '“' + d.brief + '”';
  [d.vanilla, d.dflash].forEach((a, i) => {
    document.getElementById('f'+i).src = 'explore/' + a.file;
    document.getElementById('s'+i).textContent = 'total ' + a.total + ' / 100';
    document.getElementById('c'+i).textContent = a.code;
    document.getElementById('u'+i).textContent = a.func;
    document.getElementById('cb'+i).style.width = (a.code/40*100) + '%';
    document.getElementById('ub'+i).style.width = (a.func/60*100) + '%';
    document.getElementById('d'+i).textContent = a.feedback;
  });
  document.getElementById('w0').style.display = d.vanilla.total > d.dflash.total ? '' : 'none';
  document.getElementById('w1').style.display = d.dflash.total > d.vanilla.total ? '' : 'none';
}
show('od673');
</script>
</body></html>
