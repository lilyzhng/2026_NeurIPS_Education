<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="Three bar charts: target model gives cat and dog 0.5 each; rejection sampling output keeps 0.5 and 0.5; relaxed rule output shifts to cat 0.2 and dog 0.8">
  <style>
    .eyebrow { font: 700 11px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #FFFFFF; letter-spacing: 0.12em; }
    .ptitle  { font: 600 12px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #FFFFFF; }
    .psub    { font: 500 10.5px "Fragment Mono", ui-monospace, Menlo, monospace; fill: rgba(255,255,255,0.6); }
    .tick    { font: 500 10px "Fragment Mono", ui-monospace, Menlo, monospace; fill: rgba(255,255,255,0.5); }
    .lbl     { font: 500 11px "Fragment Mono", ui-monospace, Menlo, monospace; fill: rgba(255,255,255,0.75); }
    .val     { font: 600 12px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #FFFFFF; }
    .grid    { stroke: rgba(255,255,255,0.08); stroke-width: 1; }
    .axis    { stroke: rgba(255,255,255,0.35); stroke-width: 1; }
  </style>

  <rect x="0" y="0" width="960" height="340" fill="#1e2a1c"/>

  <text class="eyebrow" x="40" y="30">"THE BEST PET IS A ___" &#183; TEMPERATURE 1 &#183; DRAFT PREFERS DOG: Q = 0.2 / 0.8</text>

  <!-- panels: plot baseline y=290, top y=110, 180px per 1.0 probability -->
  <!-- ===== panel 1: target model ===== -->
  <text class="ptitle" x="185" y="66" text-anchor="middle">TARGET MODEL p(x)</text>
  <g class="grid">
    <line x1="60" y1="245" x2="310" y2="245"/>
    <line x1="60" y1="200" x2="310" y2="200"/>
    <line x1="60" y1="155" x2="310" y2="155"/>
    <line x1="60" y1="110" x2="310" y2="110"/>
  </g>
  <line class="axis" x1="60" y1="110" x2="60" y2="290"/>
  <line class="axis" x1="60" y1="290" x2="310" y2="290"/>
  <g class="tick" text-anchor="end">
    <text x="52" y="294">0.00</text>
    <text x="52" y="249">0.25</text>
    <text x="52" y="204">0.50</text>
    <text x="52" y="159">0.75</text>
    <text x="52" y="114">1.00</text>
  </g>
  <text class="tick" x="16" y="200" transform="rotate(-90 16 200)" text-anchor="middle">probability of next token</text>
  <rect x="95"  y="200" width="70" height="90" fill="#93a888"/>
  <rect x="205" y="200" width="70" height="90" fill="#93a888"/>
  <text class="val" x="130" y="190" text-anchor="middle">0.5</text>
  <text class="val" x="240" y="190" text-anchor="middle">0.5</text>
  <text class="lbl" x="130" y="310" text-anchor="middle">cat</text>
  <text class="lbl" x="240" y="310" text-anchor="middle">dog</text>

  <!-- ===== panel 2: rejection sampling (lossless) ===== -->
  <text class="ptitle" x="495" y="58" text-anchor="middle">REJECTION SAMPLING OUTPUT</text>
  <text class="psub" x="495" y="76" text-anchor="middle">(LOSSLESS)</text>
  <g class="grid">
    <line x1="370" y1="245" x2="620" y2="245"/>
    <line x1="370" y1="200" x2="620" y2="200"/>
    <line x1="370" y1="155" x2="620" y2="155"/>
    <line x1="370" y1="110" x2="620" y2="110"/>
  </g>
  <line class="axis" x1="370" y1="110" x2="370" y2="290"/>
  <line class="axis" x1="370" y1="290" x2="620" y2="290"/>
  <rect x="405" y="200" width="70" height="90" fill="#8cc07a"/>
  <rect x="515" y="200" width="70" height="90" fill="#8cc07a"/>
  <text class="val" x="440" y="190" text-anchor="middle">0.5</text>
  <text class="val" x="550" y="190" text-anchor="middle">0.5</text>
  <text class="lbl" x="440" y="310" text-anchor="middle">cat</text>
  <text class="lbl" x="550" y="310" text-anchor="middle">dog</text>

  <!-- ===== panel 3: relaxed rule (follows the draft) ===== -->
  <text class="ptitle" x="805" y="58" text-anchor="middle">RELAXED RULE OUTPUT</text>
  <text class="psub" x="805" y="76" text-anchor="middle">(FOLLOWS THE DRAFT)</text>
  <g class="grid">
    <line x1="680" y1="245" x2="930" y2="245"/>
    <line x1="680" y1="200" x2="930" y2="200"/>
    <line x1="680" y1="155" x2="930" y2="155"/>
    <line x1="680" y1="110" x2="930" y2="110"/>
  </g>
  <line class="axis" x1="680" y1="110" x2="680" y2="290"/>
  <line class="axis" x1="680" y1="290" x2="930" y2="290"/>
  <rect x="715" y="254" width="70" height="36"  fill="#b3a369"/>
  <rect x="825" y="146" width="70" height="144" fill="#b3a369"/>
  <text class="val" x="750" y="244" text-anchor="middle">0.2</text>
  <text class="val" x="860" y="136" text-anchor="middle">0.8</text>
  <text class="lbl" x="750" y="310" text-anchor="middle">cat</text>
  <text class="lbl" x="860" y="310" text-anchor="middle">dog</text>
</svg>
