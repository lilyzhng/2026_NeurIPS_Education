<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figure A2 — The model layer absorbs acceleration</title>
<style>@font-face{font-family:"PencilPete";src:url("PencilPete.ttf") format("truetype");}</style>
<style>
:root{
  --_serif: var(--serif, Georgia, 'Iowan Old Style', 'Times New Roman', serif);
  --chalk:#F5F4EF;
  --chalk-dim:rgba(245,244,239,.55);
  --chalk-faint:rgba(245,244,239,.3);
  --board:#12291d;
  --frame:#7A5230;
}
*{box-sizing:border-box}
html{zoom:0.8}
body{margin:0;padding:0 0 4px;background:transparent;font-family:var(--_serif)}
.wrap{max-width:940px;margin:0 auto}
.board{
  background:var(--frame);border-radius:16px;padding:12px;position:relative;
}
.slate{
  position:relative;font-family:'PencilPete',cursive;
  border-radius:10px;padding:30px 34px 52px;color:var(--chalk);
  background:
    radial-gradient(ellipse 60% 40% at 20% 30%, rgba(255,255,255,0.045), transparent 60%),
    radial-gradient(ellipse 50% 45% at 75% 70%, rgba(255,255,255,0.035), transparent 60%),
    radial-gradient(ellipse 40% 30% at 55% 15%, rgba(255,255,255,0.03), transparent 60%),
    var(--board);
}
svg{display:block;width:100%;height:auto;overflow:visible}
.layerttl{font-family:'PencilPete',cursive;font-size:30px;font-weight:700;letter-spacing:.16em;fill:var(--chalk)}
.layersub{font-family:'PencilPete',cursive;font-size:18px;fill:var(--chalk-dim)}
.serving{font-family:'PencilPete',cursive;font-size:19px;fill:var(--chalk-dim);letter-spacing:.05em}
.mname{font-family:'PencilPete',cursive;font-size:25px;font-weight:700;fill:var(--chalk)}
.mdate{font-family:'PencilPete',cursive;font-size:18px;fill:var(--chalk-dim)}
.mdet{font-family:'PencilPete',cursive;font-size:18px;fill:var(--chalk-dim)}
.yr{font-family:'PencilPete',cursive;font-size:20px;fill:var(--chalk-dim)}
.axis{stroke:rgba(245,244,239,.4);stroke-width:1.6}
.stair{
  fill:none;stroke:rgba(245,244,239,.85);stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:6 7;
}
.stairclip{
  fill:none;stroke:rgba(245,244,239,.85);stroke-width:2.4;
}
.dot{fill:rgba(245,244,239,.95);stroke:var(--board);stroke-width:2}
.region{fill:url(#hatch)}
.hatchline{stroke:rgba(245,244,239,.3);stroke-width:1.1}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="slip1" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.010" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="slip2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="slip3" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<div class="wrap">
  <div class="board"><div class="slate">

    <svg viewBox="0 0 900 470" role="img"
         aria-label="A rising staircase boundary: DeepSeek-V3 fp8 at pre-training, gpt-oss mxfp4 QAT, K2-Thinking benchmarks at int4, Kimi K3 shipped draft model. The model layer grows as serving shrinks toward one job.">
      <defs>
        <pattern id="hatch" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)">
          <line class="hatchline" x1="0" y1="0" x2="0" y2="9"/>
        </pattern>
      </defs>

      <!-- model layer region, revealed left to right as the staircase draws -->
      <polygon class="region"
        points="40,410 40,380 130,380 130,300 330,300 330,220 530,220 530,140 730,140 730,80 870,80 870,410"/>

      <!-- what serving still does at each stage -->
      <text class="serving" x="52"  y="44">quantize &middot; draft &middot; serve</text>
      <text class="serving" x="352" y="44">draft &middot; serve</text>
      <text class="serving" x="596" y="44">draft &middot; serve</text>
      <text class="serving" x="792" y="44">serve</text>

      <text class="layerttl" x="52" y="112">SERVING LAYER</text>

      <!-- the staircase -->
      <path class="stair"
        d="M40,380 L130,380 L130,300 L330,300 L330,220 L530,220 L530,140 L730,140 L730,80 L870,80"/>

      <!-- milestones -->
      <g><circle class="dot" cx="130" cy="300" r="8"/></g>
      <g>
        <text class="mname" x="140" y="330">DeepSeek-V3</text>
        <text class="mdate" x="140" y="354">Dec 2024</text>
        <text class="mdet"  x="140" y="378">fp8 @ pre-training</text>
      </g>

      <g><circle class="dot" cx="330" cy="220" r="8"/></g>
      <g>
        <text class="mname" x="340" y="250">gpt-oss</text>
        <text class="mdate" x="340" y="274">Aug 2025</text>
        <text class="mdet"  x="340" y="298">mxfp4 QAT</text>
      </g>

      <g><circle class="dot" cx="530" cy="140" r="8"/></g>
      <g>
        <text class="mname" x="540" y="170">K2-Thinking</text>
        <text class="mdate" x="540" y="194">Nov 2025</text>
        <text class="mdet"  x="540" y="218">benchmarks @ int4</text>
      </g>

      <g><circle class="dot" cx="730" cy="80" r="8"/></g>
      <g>
        <text class="mname" x="740" y="110">Kimi K3</text>
        <text class="mdate" x="740" y="134">Jul 2026</text>
        <text class="mdet"  x="740" y="158">shipped draft model</text>
      </g>

      <!-- model layer caption -->
      <text class="layerttl" x="858" y="352" text-anchor="end">MODEL LAYER</text>
      <text class="layersub" x="858" y="378" text-anchor="end" font-style="italic">starts to own more of inference acceleration</text>

      <!-- time axis -->
      <line class="axis" x1="40" y1="412" x2="870" y2="412"/>
      <text class="yr" x="430" y="440" text-anchor="middle">2025</text>
      <text class="yr" x="730" y="440" text-anchor="middle">2026</text>
    </svg>

  </div></div>

</div>
<script>
(function(){
  function postHeight(){
    parent.postMessage({
      chalkHeight: Math.ceil(document.body.getBoundingClientRect().height),
      chalkSrc: location.pathname.split('/').pop()
    }, '*');
  }
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
})();
</script>
<script>
(function(){
  // hand-drawn slips: long strokes are harder to draw straight, so the longer
  // the element, the more likely (and eventually certain) a waver somewhere.
  var els = document.querySelectorAll('.slate span, .slate button, .slate td, .slate th, .slate .tlabel, .slate .tline, .slate .panettl, .slate .outerttl, .slate .note, .slate .pic, .slate .share, .slate .name, .slate .verdict, .slate .setup, .slate .given, .slate .bar, .slate .seg, .slate .card, .slate .pill, .slate .pane, .slate .panel, .slate .trow, .slate .outer, .slate .chunk');
  var slips = ['url(#slip1)', 'url(#slip2)', 'url(#slip3)'];
  els.forEach(function(el, i){
    var w = el.offsetWidth || 0;
    var r = ((i * 61 + 17) % 100) / 100;
    var pClean = w < 60 ? 0.85 : w < 160 ? 0.5 : w < 280 ? 0.15 : 0;
    if (r < pClean) return;
    el.style.filter = slips[i % 3];
  });
})();
</script>
</body>
</html>
