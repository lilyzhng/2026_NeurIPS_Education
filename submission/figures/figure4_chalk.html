<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figure 4 — DFlash draft vs DSpark draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --_serif: var(--serif, Georgia, 'Iowan Old Style', 'Times New Roman', serif);
  --_ink: var(--ink, #2A2A26);
  --chalk:#DFDBCE;
  --chalk-dim:rgba(223,219,206,.55);
  --chalk-faint:rgba(223,219,206,.32);
  --board:#12291d;
  --frame:#7A5230;
}
*{box-sizing:border-box}
html{zoom:0.8}
body{
  margin:0;padding:0 0 4px;background:transparent;
  font-family:var(--_serif);
}
.wrap{max-width:940px;margin:0 auto}
.board{background:var(--frame);border-radius:16px;padding:12px;position:relative}
.slate{
  position:relative;font-family:'Amatic SC',cursive;
  border-radius:10px;padding:30px 34px 52px;color:var(--chalk);
  background:
    radial-gradient(ellipse 60% 40% at 20% 30%, rgba(255,255,255,0.045), transparent 60%),
    radial-gradient(ellipse 50% 45% at 75% 70%, rgba(255,255,255,0.035), transparent 60%),
    radial-gradient(ellipse 40% 30% at 55% 15%, rgba(255,255,255,0.03), transparent 60%),
    var(--board);
}
.cols{display:grid;grid-template-columns:1fr 1.25fr;gap:18px}
@media(max-width:720px){.cols{grid-template-columns:1fr}}
.lane{
  border:1.5px dashed rgba(223,219,206,.45);border-radius:12px;
  padding:16px 18px;display:flex;flex-direction:column;
}
.lane.f{transform:rotate(-0.3deg)}
.lane.k{transform:rotate(0.25deg)}
.lanehead{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lanename{
  color:var(--chalk);font-size:1.45rem;font-weight:700;letter-spacing:.1em;
}
.donebadge{
  color:var(--chalk);font-size:1.1rem;
  border:1.5px solid currentColor;border-radius:50px;
  padding:2px 11px;opacity:0;transition:opacity .3s;
}
.lane.f .donebadge{transform:rotate(1.2deg)}
.lane.k .donebadge{transform:rotate(-1.4deg)}
.stacks{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;min-height:84px}
.stack{display:flex;flex-direction:column;align-items:center;gap:5px}
.chip{
  border:1.7px solid rgba(223,219,206,.75);
  border-radius:10px 8px 11px 7px;
  padding:5px 13px;font-size:1.3rem;font-weight:700;
  color:var(--chalk);
  background:rgba(223,219,206,.05);
  opacity:0;transition:opacity .3s,border-color .3s,color .3s;
}
.chip.show{opacity:1}
.stack:nth-child(odd) .chip{transform:rotate(-1.1deg)}
.stack:nth-child(even) .chip{transform:rotate(0.9deg)}
.chip.dropped{
  border-style:dashed;border-color:var(--chalk-faint);
  color:var(--chalk-faint);text-decoration:line-through;
}
.score{
  font-size:1.1rem;color:var(--chalk-dim);opacity:0;transition:opacity .3s,color .3s;
  min-height:22px;
}
.score.show{opacity:1}
.score.low{color:var(--chalk-faint)}
.droplbl{
  font-size:.95rem;color:var(--chalk-faint);opacity:0;transition:opacity .3s;min-height:18px;
}
.droplbl.show{opacity:1}
.bracket{
  margin-top:6px;height:14px;position:relative;transition:width .5s;
  border-left:2px solid rgba(223,219,206,.55);
  border-right:2px solid rgba(223,219,206,.55);
  border-bottom:2px solid rgba(223,219,206,.55);
  border-radius:0 0 8px 8px;
  opacity:0;
}
.bracket.show{opacity:1;transition:opacity .3s,width .5s}
.bracketlbl{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  font-size:1.05rem;color:var(--chalk-dim);white-space:nowrap;padding-top:2px;
}
.status{font-size:1.1rem;color:var(--chalk-dim);margin-top:auto;padding-top:34px;min-height:54px}
.replay{
  position:absolute;bottom:18px;right:28px;z-index:2;
  display:flex;align-items:center;gap:9px;
  background:none;border:none;cursor:pointer;padding:0;
}
.replay svg{display:block}
.replay .eraser{
  width:34px;height:17px;border-radius:3px;flex:none;
  background:linear-gradient(#e9e7e2 0%, #cfccc5 58%, #57544d 59%, #45423c 100%);
  box-shadow:0 1.5px 2.5px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.7);
}
.replay:hover .eraser{filter:brightness(1.08)}
.replay:focus-visible{outline:2px solid rgba(223,219,206,.6);outline-offset:3px}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
  .chip,.lane{transform:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="board"><div class="slate">
    <div class="cols">

      <div class="lane f">
        <div class="lanehead">
          <span class="lanename">DFlash draft</span>
          <span class="donebadge" id="doneF">to verify: 5 tokens</span>
        </div>
        <div class="stacks" id="stacksF"></div>
        <div class="bracket" id="bracketF" style="width:100%"><span class="bracketlbl">all sent to verify</span></div>
        <div class="status" id="statusF"></div>
      </div>

      <div class="lane k">
        <div class="lanehead">
          <span class="lanename">DSpark draft</span>
          <span class="donebadge" id="doneK">to verify: 3 &middot; 2 slots saved &#10003;</span>
        </div>
        <div class="stacks" id="stacksK"></div>
        <div class="bracket" id="bracketK"><span class="bracketlbl" id="bracketKlbl">sequential head: positions chained</span></div>
        <div class="status" id="statusK"></div>
      </div>

    </div>
    <button class="replay" id="replay" type="button" aria-label="replay"><svg viewBox="0 0 24 24" width="22" height="22" fill="none"><path d="M19.2 12.3 A7.2 7.2 0 1 1 16.6 6.1" stroke="#DFDBCE" stroke-width="2" stroke-linecap="round"/><path d="M16.4 3.2 L16.6 6.3 L19.5 7.1" stroke="#DFDBCE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="eraser"></span></button>
  </div></div>
</div>

<script>
(function(){
  var scores = [0.9, 0.8, 0.7, 0.3, 0.2];
  var KEEP = 3;
  var END = 8.4;   // play once, then hold here

  // DFlash lane: 5 plain token stacks
  var chipsF = [];
  var sf = document.getElementById('stacksF');
  for (var i = 1; i <= 5; i++){
    var st = document.createElement('span'); st.className = 'stack';
    var c = document.createElement('span'); c.className = 'chip'; c.textContent = 't' + i;
    st.appendChild(c); sf.appendChild(st); chipsF.push(c);
  }

  // DSpark lane: token + confidence score + drop label per stack
  var chipsK = [], scoresK = [], dropsK = [];
  var sk = document.getElementById('stacksK');
  for (var i = 1; i <= 5; i++){
    var st = document.createElement('span'); st.className = 'stack';
    var c = document.createElement('span'); c.className = 'chip'; c.textContent = 't' + i;
    var sc = document.createElement('span'); sc.className = 'score'; sc.textContent = 'c: .' + Math.round(scores[i-1]*10);
    var dl = document.createElement('span'); dl.className = 'droplbl'; dl.textContent = i > KEEP ? 'dropped' : '\u00a0';
    st.appendChild(c); st.appendChild(sc); st.appendChild(dl);
    sk.appendChild(st); chipsK.push(c); scoresK.push(sc); dropsK.push(dl);
  }

  var bracketF = document.getElementById('bracketF');
  var bracketK = document.getElementById('bracketK');
  var bracketKlbl = document.getElementById('bracketKlbl');
  var doneF = document.getElementById('doneF'), doneK = document.getElementById('doneK');
  var statusF = document.getElementById('statusF'), statusK = document.getElementById('statusK');

  function paint(t){
    // ---- DFlash: block appears at once, all bracketed to verify ----
    var fOn = t >= 0.6;
    chipsF.forEach(function(c){ c.classList.toggle('show', fOn); });
    bracketF.classList.toggle('show', t >= 1.8);
    doneF.style.opacity = t >= 1.8 ? '1' : '0';
    statusF.textContent = t >= 1.8
      ? 'no filtering \u00b7 verification checks every drafted token'
      : (fOn ? 'block drafted\u2026' : '');

    // ---- DSpark: chained reveal, scores, tail drop, shrunken bracket ----
    // chips chain in quickly (sequential head)
    chipsK.forEach(function(c, i){ c.classList.toggle('show', t >= 0.6 + i * 0.34); });
    var chainDone = t >= 0.6 + 5 * 0.34;

    // confidence scores write in
    scoresK.forEach(function(sc, i){
      sc.classList.toggle('show', t >= 3.0 + i * 0.28);
      sc.classList.toggle('low', i >= KEEP && t >= 5.4);
    });
    var scoresDone = t >= 3.0 + 5 * 0.28;

    // low-score tail dropped
    var dropped = t >= 5.4;
    chipsK.forEach(function(c, i){
      if (i >= KEEP) c.classList.toggle('dropped', dropped);
    });
    dropsK.forEach(function(dl, i){
      if (i >= KEEP) dl.classList.toggle('show', dropped);
    });

    // bracket: full width over chain, then shrinks to kept tokens
    bracketK.classList.toggle('show', chainDone);
    if (dropped){
      bracketK.style.width = '58%';
      bracketKlbl.textContent = 'sent to verify';
    } else {
      bracketK.style.width = '100%';
      bracketKlbl.textContent = 'sequential head: positions chained';
    }
    doneK.style.opacity = dropped ? '1' : '0';

    if (dropped){
      statusK.textContent = 'low-score tail dropped \u00b7 saves verification capacity';
    } else if (scoresDone){
      statusK.textContent = 'confidence head scores each position\u2026';
    } else if (chainDone){
      statusK.textContent = 'confidence head scoring\u2026';
    } else if (t >= 0.5){
      statusK.textContent = 'sequential head drafting, positions chained\u2026';
    } else {
      statusK.textContent = '';
    }
  }

  var replay = document.getElementById('replay');
  var t0 = performance.now(), raf = null;

  function tick(){
    var t = (performance.now() - t0) / 1000;
    if (t >= END){ paint(END); raf = null; return; }   // play once, then hold
    paint(t);
    raf = requestAnimationFrame(tick);
  }

  function play(){
    if (raf) cancelAnimationFrame(raf);
    t0 = performance.now();
    paint(0);
    raf = requestAnimationFrame(tick);
  }

  replay.addEventListener('click', play);
  play();

  function postHeight(){
    parent.postMessage({
      chalkHeight: Math.ceil(document.body.getBoundingClientRect().height),
      chalkSrc: location.pathname.split('/').pop()
    }, '*');
  }
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
})();
</script>
</body>
</html>
