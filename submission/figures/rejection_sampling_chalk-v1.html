<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rejection sampling: NeurIPS 2026 is ___</title>
<style>@font-face{font-family:"PencilPete";src:url("PencilPete.ttf") format("truetype");}</style>
<style>
:root{
  --chalk:#F5F4EF;
  --chalk-dim:rgba(245,244,239,.55);
  --board:#12291d;
  --frame:#7A5230;
}
*{box-sizing:border-box}
html{zoom:0.8}
body{margin:0;padding:0;background:transparent;font-family:Georgia,serif}
.wrap{max-width:940px;margin:0 auto}
.board{background:var(--frame);border-radius:16px;padding:12px;position:relative}
.slate{
  position:relative;font-family:'PencilPete',cursive;
  border-radius:10px;padding:28px 34px 26px;color:var(--chalk);
  background:
    radial-gradient(ellipse 60% 40% at 20% 30%, rgba(255,255,255,0.045), transparent 60%),
    radial-gradient(ellipse 50% 45% at 75% 70%, rgba(255,255,255,0.035), transparent 60%),
    var(--board);
}
.title{font-size:1.35rem;font-weight:700;letter-spacing:.08em;margin-bottom:18px;transform:rotate(-0.3deg)}
.gridwrap{display:grid;grid-template-columns:250px repeat(4,1fr);column-gap:10px;row-gap:14px;align-items:center}
.rowlbl{font-size:1.05rem;color:var(--chalk-dim);text-align:right;padding-right:8px;line-height:1.3}
.slot{position:relative;display:flex;justify-content:center}
.prefixrow{display:flex;gap:8px;align-items:flex-end}
.chip{
  border:1.8px solid rgba(245,244,239,.8);border-radius:10px 8px 11px 7px;
  padding:5px 13px;font-size:1.25rem;font-weight:700;color:var(--chalk);
  background:rgba(245,244,239,.05);
  opacity:0;transition:opacity .4s, border-color .3s, color .3s, background .3s;
  white-space:nowrap;
}
.chip.show{opacity:1}
.chip.prefix{background:rgba(245,244,239,.85);color:#12291d;border-color:rgba(245,244,239,.9)}
.chip.checking{box-shadow:0 0 0 3px rgba(245,244,239,.2)}
.chip.ok{border-color:rgba(188,217,168,.95)}
.chip.dead{border-style:dashed;border-color:rgba(232,150,120,.85);color:rgba(232,150,120,.95);text-decoration:line-through}
.chip.gone{opacity:.35;border-style:dashed;color:var(--chalk-dim);text-decoration:line-through;background:rgba(245,244,239,.10)}
.repl{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(6px);
  opacity:0;transition:opacity .5s, transform .5s;
}
.repl.show{opacity:1;transform:translateX(-50%) translateY(0)}
.repl .chip{opacity:1;border-color:rgba(188,217,168,.95);color:#cfe4bd}
.num{font-size:1.3rem;font-weight:700;text-align:center;opacity:0;transition:opacity .35s;min-height:26px}
.num.show{opacity:1}
.num.hot{font-size:1.45rem}
.num.no{color:#e8b9a8}
.num.okc{color:#cfe4bd}
.num.dim{color:var(--chalk-dim);font-weight:400}
.outline{margin-top:22px;font-size:1.35rem}
.outline .k{color:var(--chalk-dim);font-size:1.05rem;letter-spacing:.08em;margin-right:10px}
.punch{margin-top:10px;font-size:1.3rem;text-align:center;opacity:0;transition:opacity .6s;transform:rotate(-0.4deg)}
.punch.show{opacity:1}
.formula{margin-top:6px;text-align:center;font-size:1rem;color:var(--chalk-dim)}
.replay{
  position:absolute;bottom:16px;right:26px;z-index:2;
  display:flex;align-items:center;gap:9px;
  background:none;border:none;cursor:pointer;padding:0;
}
.replay svg{display:block;filter:url(#slip2)}
.replay .eraser{
  width:34px;height:17px;border-radius:3px;flex:none;
  background:linear-gradient(#e9e7e2 0%, #cfccc5 58%, #57544d 59%, #45423c 100%);
  box-shadow:0 1.5px 2.5px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.7);
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="slip2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<div class="wrap">
  <div class="board"><div class="slate">
    <button class="replay" id="replay" type="button" aria-label="replay"><svg viewBox="0 0 24 24" width="22" height="22" fill="none"><path d="M20.49 15 a9 9 0 1 1 -2.12 -9.36 L23 10" stroke="#F5F4EF" stroke-width="1.8" stroke-linecap="round" fill="none"/><polyline points="23 4 23 10 17 10" stroke="#F5F4EF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span class="eraser"></span></button>

    <div class="title">rejection sampling: the target always wins</div>

    <div class="gridwrap" style="margin-bottom:4px">
      <div class="rowlbl"></div>
      <div class="slot" style="grid-column:2 / span 4; justify-content:flex-start">
        <div class="prefixrow" id="prefixrow"></div>
      </div>
    </div>

    <div class="gridwrap">
      <div class="rowlbl">draft proposes</div>
      <div class="slot" id="s0"></div>
      <div class="slot" id="s1"></div>
      <div class="slot" id="s2"></div>
      <div class="slot" id="s3"></div>

      <div class="rowlbl">target model probability p(x)</div>
      <div class="num" id="p0"></div><div class="num" id="p1"></div><div class="num" id="p2"></div><div class="num" id="p3"></div>

      <div class="rowlbl">draft model probability q(x)</div>
      <div class="num" id="q0"></div><div class="num" id="q1"></div><div class="num" id="q2"></div><div class="num" id="q3"></div>

      <div class="rowlbl">accepted with min(1, p/q)</div>
      <div class="num hot" id="a0"></div><div class="num hot" id="a1"></div><div class="num hot" id="a2"></div><div class="num hot" id="a3"></div>
    </div>

    <div class="outline"><span class="k">OUTPUT</span> <span id="output">NeurIPS 2026 is</span></div>
    <div class="punch" id="punch">a wrong draft costs time, never correctness</div>
    <div class="formula">rejected &rarr; resample from norm(max(0, p&nbsp;&minus;&nbsp;q)), and the rest of the draft is discarded</div>
  </div></div>
</div>

<script>
(function(){
  var PREFIX = ['NeurIPS', '2026', 'is'];
  var TOKS = [
    {w:'in',    p:'0.95', q:'0.90', a:'1.00', ok:true},
    {w:'San',   p:'0.05', q:'0.70', a:'0.07', ok:false, repl:'Sydney'},
    {w:'Diego', p:'0.10', q:'0.80', a:'0.13'},
    {w:',',     p:'0.60', q:'0.85', a:'0.71'}
  ];
  var OUT0 = 'NeurIPS 2026 is';

  var prefixrow = document.getElementById('prefixrow');
  var output = document.getElementById('output');
  var punch = document.getElementById('punch');
  var slots = [], nums = {p:[], q:[], a:[]}, chips = [], repls = [];

  function build(){
    prefixrow.innerHTML = '';
    PREFIX.forEach(function(w){
      var c = document.createElement('span');
      c.className = 'chip prefix show'; c.textContent = w;
      prefixrow.appendChild(c);
    });
    chips = []; repls = [];
    TOKS.forEach(function(t, i){
      var slot = document.getElementById('s' + i);
      slot.innerHTML = '';
      var c = document.createElement('span');
      c.className = 'chip'; c.textContent = t.w;
      slot.appendChild(c); chips.push(c);
      var r = null;
      if (t.repl){
        r = document.createElement('span');
        r.className = 'repl';
        r.innerHTML = '<span class="chip">' + t.repl + '</span>';
        slot.appendChild(r);
      }
      repls.push(r);
      ['p','q','a'].forEach(function(k){
        var el = document.getElementById(k + i);
        el.textContent = ''; el.className = 'num' + (k === 'a' ? ' hot' : '');
        nums[k][i] = el;
      });
    });
  }

  function showNum(k, i, cls){
    var el = nums[k][i];
    el.textContent = TOKS[i][k];
    el.classList.add('show');
    if (cls) el.classList.add(cls);
  }

  var steps = [
    [0.4, function(){ chips.forEach(function(c,i){ setTimeout(function(){ c.classList.add('show'); }, i*130); }); }],
    // token 0: in — accepted
    [1.3, function(){ chips[0].classList.add('checking'); showNum('p',0); }],
    [1.8, function(){ showNum('q',0); }],
    [2.4, function(){ showNum('a',0,'okc'); chips[0].classList.remove('checking'); chips[0].classList.add('ok');
                      output.textContent = OUT0 + ' in'; }],
    // token 1: San — rejected, Sydney resampled
    [3.4, function(){ chips[1].classList.add('checking'); showNum('p',1); }],
    [3.9, function(){ showNum('q',1); }],
    [4.6, function(){ showNum('a',1,'no'); chips[1].classList.remove('checking'); chips[1].classList.add('dead'); }],
    [5.4, function(){ repls[1].classList.add('show'); output.textContent = OUT0 + ' in Sydney'; }],
    // suffix: numbers appear dim, then columns die together
    [6.2, function(){ showNum('p',2,'dim'); showNum('q',2,'dim'); showNum('a',2,'dim');
                      showNum('p',3,'dim'); showNum('q',3,'dim'); showNum('a',3,'dim'); }],
    [7.0, function(){ chips[2].classList.add('gone'); chips[3].classList.add('gone'); }],
    [8.0, function(){ punch.classList.add('show'); }]
  ];
  var timers = [];
  function stopAll(){ timers.forEach(clearTimeout); timers = []; }
  function play(){
    stopAll(); build();
    output.textContent = OUT0; punch.classList.remove('show');
    steps.forEach(function(st){ timers.push(setTimeout(st[1], st[0]*1000)); });
  }
  function finalState(){
    stopAll(); build();
    chips.forEach(function(c){ c.classList.add('show'); });
    chips[0].classList.add('ok'); chips[1].classList.add('dead');
    chips[2].classList.add('gone'); chips[3].classList.add('gone');
    showNum('p',0); showNum('q',0); showNum('a',0,'okc');
    showNum('p',1); showNum('q',1); showNum('a',1,'no');
    ['p','q','a'].forEach(function(k){ showNum(k,2,'dim'); showNum(k,3,'dim'); });
    repls[1].classList.add('show');
    output.textContent = OUT0 + ' in Sydney';
    punch.classList.add('show');
  }

  document.getElementById('replay').addEventListener('click', play);
  play();

  window.addEventListener('beforeprint', function(){ try{ finalState(); }catch(e){} });
  if (location.search.indexOf('final') !== -1) setTimeout(finalState, 300);

  function postHeight(){
    parent.postMessage({
      chalkHeight: Math.ceil(document.body.getBoundingClientRect().height),
      chalkSrc: location.pathname.split('/').pop()
    }, '*');
  }
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(postHeight);
  setTimeout(postHeight, 1500);
})();
</script>
</body>
</html>
